<!doctype html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 · vrisco</title>
  <link rel="icon" href="/vrisco/assets/img/favicon.svg" type="image/svg+xml">
  <style>
    :root { --bg:#0b0e13; --ink:#e7ecf2; --mute:#8a94a3; --accent:#4cc9ff; }
    @media (prefers-color-scheme: light) { :root { --bg:#f4f6f9; --ink:#0d1320; --mute:#566273; --accent:#0072b5; } }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px 16px;
           background:var(--bg); color:var(--ink); font:16px/1.6 ui-monospace,"JetBrains Mono",Consolas,monospace; }
    main { max-width: 34em; }
    h1 { font-size: clamp(56px, 14vw, 120px); line-height:1; margin:0 0 12px; letter-spacing:-.04em; }
    h1 span { color: var(--accent); }
    p { color: var(--mute); margin: 0 0 8px; }
    a { color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <h1>404<span>.</span></h1>

    <p><a href="/vrisco/">← Volver a vrisco</a></p>

</html>
